apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO(aluno): troque cicd-dev pelo seu projeto de desenvolvimento ($DEV_NS) aqui e em "newName".
namespace: frozo-dev

resources:
  - ../../base

# As linhas "newName", "digest" e "APP_VERSION" sao reescritas pelo pipeline (task update-config).
# Nao altere o formato delas: o pipeline as localiza por padrao de texto.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/frozo-dev/luz-bairro
    digest: sha256:445418270ddad93cf9f4ad05c4691d362cc99d4f651dc1b273cf992db0c42719

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_VERSION=b54d7f5
