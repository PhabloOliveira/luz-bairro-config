apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente de homologacao: usado apenas no Incidente D do Exercicio 9.
namespace: frozo-hml

resources:
  - ../../base

# Como em producao, a imagem NAO e construida aqui: e a mesma imagem de dev, por digest.
# O digest e a versao sao copiados de dev por: bash scripts/promover.sh hml
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/frozo-dev/luz-bairro
    digest: sha256:ff65a0a20a0d042ef9184539b85f73dbfb50a8ddcac87673b59723d66a31426d

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - HOMOLOGACAO
      - APP_ENV=hml
      - APP_VERSION=69917fd
